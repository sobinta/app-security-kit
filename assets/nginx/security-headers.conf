# /etc/nginx/snippets/security-headers.conf
# include inside every HTTPS `server { }` block:   include snippets/security-headers.conf;
# NOTE: a `location` that has its own add_header loses these — include the snippet there too.

server_tokens off;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # add "; preload" only when every subdomain is HTTPS
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP: start with Report-Only, check the browser console, then rename the header to Content-Security-Policy.
# If the app (e.g. Next.js with nonces) sets its own CSP, delete this line to avoid two policies.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Block dotfiles (.env, .git, .htpasswd …) except ACME challenges, and backup/dump/archive leftovers.
location ~ /\.(?!well-known/) { return 404; }
location ~* \.(?:bak|backup|old|orig|save|swp|swo|sql|sqlite3?|db|dump|tar|tgz|rar|7z|log|ini|sh|env|pem|key)$ { return 404; }
location ~* (?:^|/)(?:backup|db|dump|site|www)[^/]*\.zip$ { return 404; }   # add other .zip names you never want public
# No PHP execution inside upload folders (PHP stacks)
location ~* ^/(?:uploads|wp-content/uploads|images|media|tmp|cache)/.*\.(?:php\d?|phtml|phar)$ { return 403; }
autoindex off;
