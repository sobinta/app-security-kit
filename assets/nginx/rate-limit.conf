# ---- part 1: put in the http { } context, e.g. /etc/nginx/conf.d/rate-limit-zones.conf ----
limit_req_zone  $binary_remote_addr zone=auth:10m  rate=10r/m;   # login / signup / reset / OTP
limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;   # general API
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;
# Behind Cloudflare: restore the real client IP first or every visitor shares Cloudflare's IPs
# set_real_ip_from 173.245.48.0/20;  # … all Cloudflare ranges (https://www.cloudflare.com/ips/)
# real_ip_header CF-Connecting-IP;

# ---- part 2: put in each server { } block, e.g. /etc/nginx/snippets/rate-limit-server.conf ----
# client_max_body_size 10m;          # match your largest legitimate upload (S18)
