<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>تغییر رمز</title></head>
<body style="font-family:Tahoma,sans-serif;max-width:420px;margin:40px auto">
  <h2>رمز جدید</h2>
  <form id="f"><input name="password" type="password" placeholder="رمز جدید"><button>ذخیره</button></form>
  <p id="msg"></p>
  <script>
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const token = new URLSearchParams(location.search).get('token');
      const password = new FormData(e.target).get('password');
      const r = await fetch('/api/password/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password }) });
      document.getElementById('msg').textContent = (await r.json()).ok ? 'رمز عوض شد' : 'توکن نامعتبر';
    };
  </script>
</body></html>
